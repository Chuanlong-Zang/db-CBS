environment:
  min: [0, 0]
  max: [5, 5]
  obstacles:
    - type: box
      center: [ 3.0, 2.0 ]
      size: [ 0.25, 0.25 ]
robots:
  - type: double_integrator_0
    start: [1, 2.5, 0, 0]
    goal:  [4, 2.5, 0, 0]
    footprint:
      shape: circle
      radius: 0.20              # meters

  - type: unicycle_first_order_0
    start: [4, 2.5, 0]
    goal:  [1, 2.5, 0]
    footprint:
      shape: box
      size:  [0.60, 0.30]       # full width x height (meters)